reward_type: asymmetric
eta: 0.5
lam: 0.1
# Q_max/order_size rescaled from the old (Q_max=10, order_size=1) pair:
# order_size was hardcoded to 1 share vs. background agents' ~100-share
# lots, making the reward's spread-capture edge ~2 orders of magnitude
# too small relative to inventory mark-to-market risk. Q_max keeps the
# same ~10-lots-worth ratio at the new order size.
Q_max: 1000
order_size: 100
tick_size: 0.01
episode_len: 390        # 390 = 6.5hr trading day at 1 step/min.
kappa: 1.0
n_lob_levels: 3
seed: 42

use_abides: true

# NOTE: this project's own synthetic-LOBSTER generator and the Hawkes-process
# background-agent calibration it fed were archived (see archive/
# lobster_calibration/, archive/hawkes/, and CLAUDE.md's Data section) — the
# simulator now runs on ABIDES's own unmodified rmsc04 background config. A
# `hawkes:` block used to live here implying calibrated arrivals were active;
# it had zero consumers anywhere in the live codebase (dead config, exactly
# the failure mode warmup_steps and prioritized_replay were this session,
# before being read and wired up or removed) and was removed rather than
# left to misinform whoever reads this file next.

# Regime overlay — set via env.regime=high_vol on CLI
# Hydra merges the regime yaml on top of this base
regime: null