# configs/config.yaml
# Top-level Hydra configuration for distrl-market-maker training runs.
#
# Usage:
#   python training/train.py                              # defaults
#   python training/train.py agent=qrdqn encoder=cnn     # override groups
#   python training/train.py agent=dqn,qrdqn,iqn --multirun
#
# Hydra config groups:
#   agent/    : dqn | qrdqn | iqn | ppo | sarsa
#   policy/   : cvar | mean | var
#   encoder/  : handcrafted | cnn | autoencoder
#   reward/   : asymmetric | quadratic | sparse
#   env/      : base (+ optional regime overlay)
#   variant/  : recurrent (optional LSTM layer on top of encoder)

defaults:
  - env: base
  - agent: qrdqn
  - encoder: handcrafted
  - reward: asymmetric
  - optional variant: null
  - optional policy: null
  - _self_

# ── Top-level overrides ───────────────────────────────────────────────
seed: 42

# CVaR tail fraction — overrides agent.cvar_alpha when set
# Passed as alpha=0.10 on CLI
alpha: 0.25

# NOTE: `variant` is NOT declared here. It comes from the `optional variant`
# config group above (null by default, populated from configs/variant/<name>.yaml
# when variant=<name> is passed on the CLI). Declaring `variant: null` in this
# _self_ block would silently clobber the group-selected value, since _self_ is
# merged last in the defaults list — do not re-add it.

# ── Training schedule ─────────────────────────────────────────────────
training:
  n_episodes:          2000    # total training episodes
  eval_every:          50      # evaluate every N episodes
  eval_episodes:       10      # episodes per evaluation run
  checkpoint_every:    100     # save checkpoint every N episodes
  checkpoint_dir: checkpoints
  log_dir:        logs
  resume:              false   # if true, resume from the latest checkpoint in
                                # checkpoint_dir/<run_tag>/ instead of episode 0
                                # (pass training.resume=true on the CLI)
  train_every_n_steps: 1       # DQN/QR-DQN/IQN gradient-update cadence in env
                                # steps (SARSA/PPO unaffected). 1 = update every
                                # step (full fidelity). Mnih et al. 2015's
                                # original Nature DQN updates every 4 frames —
                                # pass training.train_every_n_steps=4 for a
                                # ~4x training-time speedup on constrained
                                # hardware without touching episode_len or the
                                # background-agent calibration.
  warmup_steps:        1000    # steps before first gradient update
  max_grad_norm:       10.0    # gradient clipping

  # ── Early stopping (opt-in) ──────────────────────────────────────────
  # Patience-based, on smoothed EVAL Sharpe (not raw per-episode training
  # Sharpe, which is exploration-contaminated and far noisier — this
  # mirrors validation-loss-based early stopping in supervised learning).
  # Stops once the trailing mean of the last early_stopping_smooth_window
  # eval checkpoints hasn't improved by more than early_stopping_min_delta
  # for early_stopping_patience consecutive checkpoints, and at least
  # early_stopping_min_episodes have elapsed. The min_episodes floor is
  # sized for DQN/QR-DQN/IQN's epsilon_decay_steps=50000 (~episode 128 to
  # finish annealing at episode_len=390) — stopping earlier risks freezing
  # a still-mostly-random policy. Deliberately conservative: RL learning
  # curves can have long flat plateaus followed by late breakthroughs, a
  # risk this can trade off against compute savings but not eliminate.
  early_stopping:              false
  early_stopping_patience:     6
  early_stopping_min_delta:    0.05
  early_stopping_min_episodes: 150
  early_stopping_smooth_window: 3

# ── Logging ───────────────────────────────────────────────────────────
logging:
  console_every:       10      # print to console every N episodes
  wandb:               false   # set true to enable W&B logging
  wandb_project:       distrl-market-maker

# ── Hydra Configuration ───────────────────────────────────────────────
# Hydra's own run-directory bookkeeping (.hydra/config.yaml, train.log) is
# redundant with logs/<run_tag>/status.json — nothing in this codebase reads
# it — so it's redirected outside the repo (/tmp) instead of accumulating
# as outputs/<date>/<time>/ litter in the project directory. chdir:false
# already keeps the actual training I/O (logs/, checkpoints/) at the
# project root regardless of where this points.
hydra:
  run:
    dir: /tmp/distrl-hydra-runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false    # ← keep cwd as project root