# QR-DQN agent config
type: qrdqn
n_quantiles: 32    # was 200 — use 32 for local testing, 200 for HPC runs
hidden_dim: 256
dueling: true
prioritized_replay: true
lr: 0.0001
batch_size: 256
gamma: 0.99
target_update_freq: 1000
# for CVaR tail-risk objective
cvar_alpha: 0.25        # CVaR at 25th percentile (tail risk)
replay_buffer_size: 100000
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 50000
