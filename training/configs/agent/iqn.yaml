# IQN agent config
n_quantile_samples: 64
embedding_dim: 64
hidden_dim: 256
lr: 0.0001
batch_size: 256
gamma: 0.99
dueling: true           # should match QR-DQN for fair comparison
cvar_alpha: 0.25        # same CVaR objective
replay_buffer_size: 100000
target_update_freq: 1000
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 50000
